spring:
  application:
    name: Semantic Search Java
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:semanticsearch}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: false
    baseline-on-migrate: true
  data:
    # spring.data.redis is the Boot 3 property path. Boot 2 read these from
    # spring.redis, which Boot 3 ignores.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    deserialization:
      # Reject request bodies carrying fields the DTO does not define. Jackson
      # ignores them by default, so a client misspelling a parameter would get a
      # 200 and default behaviour instead of being told the field is unknown.
      fail-on-unknown-properties: true
  cache:
    type: ${SPRING_CACHE_TYPE:redis}
    redis:
      time-to-live: 3600
  security:
    user:
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD:admin}

# Settings for the @Retry and @CircuitBreaker annotations on EmbeddingService.
# resilience4j-spring-boot3 builds its registries from properties and ignores
# hand-built RetryConfig or CircuitBreakerConfig beans, so these have to live here
# to take effect.
resilience4j:
  retry:
    instances:
      embedding:
        max-attempts: 3
        wait-duration: 1s
  circuitbreaker:
    instances:
      embedding:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        sliding-window-size: 10

elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}
  protocol: ${ELASTICSEARCH_PROTOCOL:http}
  username: ${ELASTICSEARCH_USERNAME:}
  password: ${ELASTICSEARCH_PASSWORD:}
  index:
    name: semantic-search
    auto-init: true
  # In-memory vector index. Defaults to true so the service starts with no
  # external dependencies; set to false to use a real Elasticsearch cluster.
  # Whichever index is active, its mapping is built from the width the active
  # embedding provider reports, so the two cannot disagree.
  stub-enabled: ${ELASTICSEARCH_STUB_ENABLED:true}

embedding:
  # hashing: feature hashing over words and character n-grams. Lexical, in-process,
  #          needs nothing, and the default so the service starts anywhere.
  # onnx:    a sentence-transformer run locally. Semantic, and downloads a model
  #          file of about ninety megabytes on first use.
  # openai:  a hosted embedding API. Semantic, needs a key.
  provider: ${EMBEDDING_PROVIDER:hashing}
  # Vector width for the hashing and hosted providers; the search index mapping is
  # built from it. Use 1536 for text-embedding-3-small at full width. The onnx
  # provider ignores this and reports the width of the loaded model, since that is
  # fixed by the weights.
  dimensions: ${EMBEDDING_DIMENSIONS:256}
  onnx:
    model-id: onnx/all-MiniLM-L6-v2
    # model-dir defaults to ~/.cache/semantic-search-java/models/<model name>.
    # Override it with EMBEDDING_ONNX_MODEL_DIR.
    auto-download: ${EMBEDDING_ONNX_AUTO_DOWNLOAD:true}
    # Pinned to a commit rather than a branch, and checked against the digests
    # below, so the vectors in the index are always the ones the reported
    # relevance figures were measured with.
    model-url: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/onnx/model.onnx
    model-sha256: 6fd5d72fe4589f189f8ebc006442dbb529bb7ce38f8082112682524616046452
    tokenizer-url: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/tokenizer.json
    tokenizer-sha256: be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037
    max-sequence-length: 256
  api:
    key: ${EMBEDDING_API_KEY:}
    base-url: ${EMBEDDING_API_BASE_URL:https://api.openai.com}
  model: ${EMBEDDING_MODEL:text-embedding-3-small}
  timeout: 30

security:
  auth:
    enabled: ${SECURITY_AUTH_ENABLED:true}
  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    max-age: 3600

management:
  health:
    elasticsearch:
      # Off by default because elasticsearch.stub-enabled is on by default, and
      # the in-memory index has no cluster to ping - the autoconfigured indicator
      # would report DOWN out of the box and fail any readiness probe. Set this
      # to true alongside ELASTICSEARCH_STUB_ENABLED=false; docker-compose does.
      enabled: ${MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
    metrics:
      enabled: true
    prometheus:
      enabled: true

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    docExpansion: none

search:
  # Retrieve by vector and lexically, then combine the two rankings.
  hybrid-enabled: true
  # blend: weighted sum of the two scores. rrf: reciprocal rank fusion.
  fusion: ${SEARCH_FUSION:blend}
  rrf-k: 60
  hybrid-vector-weight: 0.7
  hybrid-vector-weight-profile-b: 0.5
  scoring-profile: A
  recency-enabled: true
  recency-half-life-seconds: 604800
  recency-floor: 0.7
  bm25-k1: 1.2
  bm25-b: 0.75
  metadata-boosts: {}

seed:
  demo:
    enabled: false

eval:
  run-on-startup: false

---
# Runs the whole service with no external dependencies: in-memory database,
# in-memory vector index, local embeddings and an in-process cache. This is what
# the README quick start uses, so every setting here has to override the default
# profile rather than restate it.
spring:
  config:
    activate:
      on-profile: demo
  # Redis autoconfiguration is switched off entirely rather than just unused.
  # Leaving it on registers a connection factory and a health indicator that
  # keep dialling localhost:6379, which makes /actuator/health report DOWN and
  # fills the log with connection failures on a profile whose whole point is
  # needing nothing external.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:semanticsearch;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  cache:
    type: simple

cache:
  redis:
    enabled: false

elasticsearch:
  stub-enabled: true

embedding:
  provider: hashing

seed:
  demo:
    enabled: true

security:
  auth:
    enabled: false

logging:
  level:
    root: INFO
    io.github.semanticsearch: INFO
    org.springframework: WARN
    org.hibernate: WARN
