# The full stack: the service against real PostgreSQL, Elasticsearch and Redis.
# For a quick look with no dependencies at all, use the demo profile instead:
#   java -jar target/semantic-search-java-1.0.0.jar --spring.profiles.active=demo
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=semanticsearch
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_PROTOCOL=http
      # Use the real cluster started below rather than the in-memory index,
      # which is the default everywhere else. With a real cluster the
      # Elasticsearch health indicator becomes meaningful, so turn it on.
      - ELASTICSEARCH_STUB_ENABLED=false
      - MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # The lexical embedder by default, so the stack runs without an API key or a
      # model download. EMBEDDING_PROVIDER=onnx runs a sentence-transformer in the
      # container and needs the model volume below; openai needs a key, and
      # EMBEDDING_DIMENSIONS must then match the model. Switching provider means
      # rebuilding the index, because vectors from different models are not
      # comparable.
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-hashing}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-256}
      - SEED_DEMO_ENABLED=${SEED_DEMO_ENABLED:-true}
      - EMBEDDING_ONNX_MODEL_DIR=/var/cache/semantic-search/models
    volumes:
      # Keeps the downloaded model across container rebuilds. Unused by the
      # default provider, which downloads nothing.
      - model-cache:/var/cache/semantic-search/models
    depends_on:
      - postgres
      - elasticsearch
      - redis

  postgres:
    image: postgres:15.4-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=semanticsearch
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.4
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  model-cache:
  postgres-data:
  elasticsearch-data:
  redis-data:
