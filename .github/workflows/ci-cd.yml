name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ui:
    name: UI lint and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Build
        working-directory: ui
        run: npm run build

      # The built assets under src/main/resources/static are committed so that a
      # plain `java -jar` serves the UI. If a source change lands without a
      # rebuild the jar ships a stale interface, so fail here rather than let the
      # two drift apart silently.
      - name: Verify committed bundle is up to date
        run: |
          if ! git diff --quiet -- src/main/resources/static; then
            echo "::error::src/main/resources/static is out of date. Run 'npm run build' in ui/ and commit the result."
            git diff --stat -- src/main/resources/static
            exit 1
          fi

  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The ONNX tests need all-MiniLM-L6-v2, around ninety megabytes. Keyed on
      # the digests in application.yml so a model change fetches the new weights
      # instead of matching a stale cache entry.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/semantic-search-java/models
          key: onnx-models-${{ hashFiles('src/main/resources/application.yml') }}

      # Runs spotless, the tests and the JaCoCo coverage gate. No skip flags:
      # every check configured in the pom is one CI actually enforces.
      - name: Build with Maven
        run: ./mvnw -B clean verify

      # Tags on this action are v-prefixed. It was pinned to "0.33.1", which is
      # not a ref that exists, so the step failed to resolve and the scan never
      # ran.
      - name: Run security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Build Docker image
        run: docker build -t semantic-search-java:${{ github.sha }} .

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports

      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Save eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: target/eval/report.json
          if-no-files-found: ignore

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semantic-search-java
          path: target/*.jar

  deploy:
    name: Publish image
    needs: [ ui, build ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalize repo owner (lowercase for GHCR)
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.owner_lc }}/semantic-search-java:latest
            ghcr.io/${{ env.owner_lc }}/semantic-search-java:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
