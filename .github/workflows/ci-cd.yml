name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ui:
    name: UI lint and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Build
        working-directory: ui
        run: npm run build

      # The built assets under src/main/resources/static are committed so that a
      # plain `java -jar` serves the UI. If a source change lands without a
      # rebuild the jar ships a stale interface, so fail here rather than let the
      # two drift apart silently.
      - name: Verify committed bundle is up to date
        run: |
          if ! git diff --quiet -- src/main/resources/static; then
            echo "::error::src/main/resources/static is out of date. Run 'npm run build' in ui/ and commit the result."
            git diff --stat -- src/main/resources/static
            exit 1
          fi

  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The ONNX tests need all-MiniLM-L6-v2, around ninety megabytes. Keyed on
      # the digests in application.yml so a model change fetches the new weights
      # instead of matching a stale cache entry.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/semantic-search-java
          key: models-and-datasets-${{ hashFiles('src/main/resources/application.yml') }}

      # Runs spotless, the tests and the JaCoCo coverage gate with no skip flags,
      # so every check configured in the pom is one CI enforces.
      - name: Build with Maven
        run: ./mvnw -B clean verify

      # Tags on this action are v-prefixed. An unprefixed "0.36.0" is not a ref
      # that exists, so the step fails to resolve and the scan does not run.
      - name: Run security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Build Docker image
        run: docker build -t semantic-search-java:${{ github.sha }} .

      # Building proves the image assembles. This proves it runs, and with the
      # provider whose native libraries are the reason the base image is Debian
      # and not Alpine: on musl they fail to load and only this catches it.
      - name: Run the image and check it answers
        run: |
          # The image sets ELASTICSEARCH_STUB_ENABLED=false, because it is built
          # for the compose stack. An environment variable outranks profile YAML,
          # so the demo profile cannot turn the stub back on by itself and this
          # has to say so.
          docker run -d --name smoke -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=demo \
            -e ELASTICSEARCH_STUB_ENABLED=true \
            -e EMBEDDING_PROVIDER=onnx \
            -e EMBEDDING_ONNX_MODEL_DIR=/var/cache/semantic-search/models \
            -v ~/.cache/semantic-search-java/models/all-MiniLM-L6-v2:/var/cache/semantic-search/models:ro \
            semantic-search-java:${{ github.sha }}
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health >/dev/null && break
            sleep 2
          done
          if ! curl -sf http://localhost:8080/actuator/health; then
            docker logs smoke
            exit 1
          fi
          curl -sf --get --data-urlencode 'query=keeping p95 response time low' \
            http://localhost:8080/api/v1/search | tee /dev/stderr | grep -q '"title"'
          docker logs smoke | grep -q 'Loaded onnx/all-MiniLM-L6-v2'
          docker rm -f smoke


      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports

      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Save eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: target/eval/report.json
          if-no-files-found: ignore

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semantic-search-java
          path: target/*.jar

  # Two minutes of indexing and 1,200 queries, so it runs on request rather than
  # on every push. The report it writes is the one the README quotes, and this is
  # how to regenerate it after a change to retrieval.
  benchmark:
    name: BEIR SciFact
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache the embedding model and the corpus
        uses: actions/cache@v4
        with:
          path: ~/.cache/semantic-search-java
          key: models-and-datasets-${{ hashFiles('src/main/resources/application.yml') }}

      - name: Package
        run: ./mvnw -B clean package -DskipTests

      - name: Run the benchmark
        env:
          EMBEDDING_PROVIDER: onnx
        run: |
          java -jar target/semantic-search-java-1.0.0.jar --spring.profiles.active=benchmark
          cat docs/benchmark-scifact.json

      - name: Save the report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-scifact
          path: docs/benchmark-scifact.json

  deploy:
    name: Publish image
    needs: [ ui, build ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalize repo owner (lowercase for GHCR)
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.owner_lc }}/semantic-search-java:latest
            ghcr.io/${{ env.owner_lc }}/semantic-search-java:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
